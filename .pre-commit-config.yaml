repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ast-guard
        name: ast-guard
        entry: ast-guard
        language: python
        types: [python]
        args: ["--fail-on", "HIGH"]
