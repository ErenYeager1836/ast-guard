name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Development Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 ast_guard tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 127
          flake8 ast_guard tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Unit & Integration Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run ast-guard Self-Scan
        run: |
          python -m ast_guard ast_guard --sarif results.sarif --fail-on HIGH

      - name: Upload SARIF Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-report-python-${{ matrix.python-version }}
          path: results.sarif
