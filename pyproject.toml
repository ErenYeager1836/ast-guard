[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-guard"
version = "0.1.0"
description = "Lightweight AST-based Static Application Security Testing (SAST) scanner with SARIF 2.1.0 and CI/CD integration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nithishvelan M", email = "erenyeager1836@users.noreply.github.com" }
]
keywords = [
    "security",
    "appsec",
    "sast",
    "static-analysis",
    "ast",
    "vulnerability-scanner",
    "sarif",
    "owasp",
    "cwe"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
ast-guard = "ast_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ast_guard*"]
